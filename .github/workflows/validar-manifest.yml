name: Verificar manifiesto de Truchosafio 4
on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'herramientas/validar_manifest.py'
      - '.github/workflows/validar-manifest.yml'
  pull_request:
    paths:
      - 'manifest.json'
      - 'herramientas/validar_manifest.py'
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar versiones, rutas y hashes
        run: python herramientas/validar_manifest.py manifest.json
